name: Build GameParty APK

on:
  push:
    branches: [ "основной", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK
      run: |
        mkdir -p build/apk
        
        # Компиляция ресурсов
        $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m -J . -M AndroidManifest.xml -S . -I $ANDROID_HOME/platforms/android-34/android.jar || true
        
        # Компиляция Java
        javac -d build -classpath $ANDROID_HOME/platforms/android-34/android.jar MainActivity.java || true
        
        # DEX
        $ANDROID_HOME/build-tools/34.0.0/d8 --output build/ build/*.class || $ANDROID_HOME/build-tools/34.0.0/d8 --output build/ MainActivity.class || true
        
        # Упаковка APK
        $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M AndroidManifest.xml -S . -I $ANDROID_HOME/platforms/android-34/android.jar -F build/apk/GameParty-64bit.apk . || true
        
        # Добавление DEX в APK
        cd build && zip -u apk/GameParty-64bit.apk classes.dex || true
        cd ..

        # Подпись тестовым ключом
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android build/apk/GameParty-64bit.apk || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GameParty-64bit-APK
        path: "build/apk/*.apk"
        
