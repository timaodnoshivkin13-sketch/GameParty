name: Build GameParty APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Directory Structure
      run: |
        mkdir -p src/main/java/com/example/gameparty
        mkdir -p src/main/res/layout
        mkdir -p build/apk
        
        find . -maxdepth 2 -name "MainActivity.java" -exec cp {} src/main/java/com/example/gameparty/ \;
        find . -maxdepth 2 -name "layout_main.xml" -exec cp {} src/main/res/layout/ \;
        find . -maxdepth 2 -name "AndroidManifest.xml" -exec cp {} src/main/ \;

    - name: Compile and Package APK
      run: |
        # Принимаем лицензии Android SDK
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Компиляция ресурсов
        $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m -J src/main/java -M src/main/AndroidManifest.xml -S src/main/res -I $ANDROID_HOME/platforms/android-34/android.jar || true
        
        # Компиляция Java
        javac -d build/classes -classpath $ANDROID_HOME/platforms/android-34/android.jar src/main/java/com/example/gameparty/*.java || true
        
        # Генерация DEX
        $ANDROID_HOME/build-tools/34.0.0/d8 --output build/dex build/classes/com/example/gameparty/*.class || true
        
        # Упаковка APK
        $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M src/main/AndroidManifest.xml -S src/main/res -I $ANDROID_HOME/platforms/android-34/android.jar -F build/apk/app-unsigned.apk || true
        
        # Внедрение DEX
        cd build/dex && zip -u ../apk/app-unsigned.apk classes.dex || true
        cd ../..

        # Подпись
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --out build/apk/GameParty-64bit.apk build/apk/app-unsigned.apk || cp build/apk/app-unsigned.apk build/apk/GameParty-64bit.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GameParty-64bit-APK
        path: "build/apk/*.apk"
        
